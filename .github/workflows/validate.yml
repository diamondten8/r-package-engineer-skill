name: Validate skill and R tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Provision validation-only Python dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Provision developer R tools outside package execution
        shell: Rscript {0}
        run: |
          install.packages(c("roxygen2", "testthat", "knitr", "rmarkdown"), repos = "https://cloud.r-project.org")
      - name: Validate skill structure and links
        run: python r-package-engineer/scripts/validate_skill.py r-package-engineer
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scaffold and real R build/check smoke
        run: python tests/smoke_check.py --vignette
      - name: Preserve R check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-check-evidence-${{ matrix.os }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
